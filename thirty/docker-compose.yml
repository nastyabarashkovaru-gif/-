# Локальная разработка: Postgres + сервис. Mini App и админку удобнее запускать через vite (npm run dev:miniapp / dev:admin)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: thirty, POSTGRES_PASSWORD: thirty, POSTGRES_DB: thirty }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://thirty:thirty@db:5432/thirty
      NODE_ENV: development
      PAYMENT_PROVIDER: mock
      DEV_AUTH: 'true'
      SCHEDULER: 'true'
      PUBLIC_URL: http://localhost:4100
    ports: ['4100:4100']
volumes:
  pgdata:
